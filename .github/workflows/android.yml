# Every push builds the APK and runs the checks. Publishing lives in
# release.yml; nothing here touches a release.
name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# A branch build publishes nothing, so superseding one is free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
