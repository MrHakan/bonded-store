# Publishes a release with the APK attached. Two channels:
#
#   release   a tag that moves — move it and its release becomes the new build
#             git tag -f release && git push -f origin release
#
#   v1.2.3    a fixed version, for a build worth pinning
#             git tag v1.2.3 && git push origin v1.2.3
#
# Either can also be done from Releases -> Draft a new release. Both the tag
# push and the release event are handled, because publishing from the web UI
# raises both, and publishing against a tag that already exists raises only the
# release one.
name: Release

on:
  push:
    tags: ["release", "v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release and attach the APK

# The two events above can fire together — v1.0.0 set off both, six seconds
# apart. Serialise rather than cancel: the publish step deletes an existing
# asset before uploading, so a run cancelled midway could remove the APK and
# never replace it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same build CI runs, so a release is never packaged by a second,
  # less-checked path.
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bonded-store-apk

      # Run by hand against a branch rather than a tag there is nothing to
      # publish to, and the build is stamped as a development one.
      - name: Refuse to publish a development build
        run: |
          if [ "${{ needs.build.outputs.channel }}" = "dev" ] || [ -z "${{ needs.build.outputs.tag }}" ]; then
            echo "::error::This is a development build (${{ needs.build.outputs.version }}) with no tag. Run this workflow on the 'release' tag or a version tag."
            exit 1
          fi
          echo "Publishing ${{ needs.build.outputs.version }} to tag '${{ needs.build.outputs.tag }}' (${{ needs.build.outputs.channel }})"

      - name: Check the APK arrived
        run: |
          test -f "${{ needs.build.outputs.apk }}" \
            || { echo "::error::${{ needs.build.outputs.apk }} is missing from the build"; exit 1; }
          ls -l "${{ needs.build.outputs.apk }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.title }}
          files: ${{ needs.build.outputs.apk }}
          make_latest: true
          # A moving tag has no span to generate notes over — the same tag would
          # be asked what changed since itself.
          generate_release_notes: ${{ needs.build.outputs.channel == 'version' }}
          body: |
            **Install:** download `${{ needs.build.outputs.apk }}` onto the phone and open it.
            Android will ask you to allow installing from that source.

            Install it *over* the previous version — uninstalling erases the
            store's ledger.

            Android 7.0 or newer. Camera permission is used only for reading a
            product's QR label; the app has no internet permission.

            Built from `${{ github.sha }}`.
