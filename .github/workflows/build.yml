# The build, once. Both the CI workflow and the release workflow call this, so
# a release is packaged by exactly the path that CI proves — a check added here
# cannot be missing from the other.
name: Build

on:
  workflow_call:
    outputs:
      version:
        description: Version this build was stamped with
        value: ${{ jobs.apk.outputs.version }}
      apk:
        description: File name of the built APK
        value: ${{ jobs.apk.outputs.apk }}
      tag:
        description: Tag this build belongs to, empty for a branch build
        value: ${{ jobs.apk.outputs.tag }}
      channel:
        description: rolling, version, or dev
        value: ${{ jobs.apk.outputs.channel }}
      title:
        description: Release title for this build
        value: ${{ jobs.apk.outputs.title }}

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.name }}
      apk: ${{ steps.apk.outputs.path }}
      tag: ${{ steps.v.outputs.tag }}
      channel: ${{ steps.v.outputs.channel }}
      title: ${{ steps.v.outputs.title }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install the SDK pieces the build needs
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # A called workflow sees the caller's event, so a tag, a published
      # release and a branch push are all still told apart here.
      #
      # Two release channels:
      #   release   a tag that moves — always the newest build
      #   v1.2.3    a fixed version, kept for when one is worth pinning
      #
      # versionCode is minutes since 2020 for BOTH, and that is deliberate.
      # Android refuses an APK whose versionCode is lower than the installed
      # one, so the two channels cannot each count on their own: a v1.2.3 at
      # 10203 could never install over a rolling build at 3.5 million. A clock
      # only ever goes forward, so any build is installable over any older one,
      # whichever tag it came from.
      - name: Work out the version
        id: v
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"                      # published from the web UI
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"                # tag pushed from a terminal
          else
            TAG=""
          fi

          case "$TAG" in
            "")       NAME="0.0.0-$(git rev-parse --short HEAD)"
                      CHANNEL=dev ;;
            release)  NAME="$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)"
                      CHANNEL=rolling ;;
            v*)       NAME="${TAG#v}"
                      CHANNEL=version ;;
            *)        NAME="$TAG"
                      CHANNEL=version ;;
          esac

          CODE=$(( ( $(date -u +%s) - 1577836800 ) / 60 ))

          if [ "$CHANNEL" = "rolling" ]; then
            TITLE="Bonded Store · latest ($NAME)"
          else
            TITLE="Bonded Store $NAME"
          fi

          echo "name=$NAME"       >> "$GITHUB_OUTPUT"
          echo "code=$CODE"       >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE"     >> "$GITHUB_OUTPUT"
          echo "$CHANNEL: $NAME (versionCode $CODE), tag '$TAG'"

      # The signing key lives in repository secrets, never in the repository.
      # Without it the build still works, but falls back to the debug key.
      - name: Restore the signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — falling back to the debug key. APKs signed this way cannot be installed over each other, so updating means uninstalling, which erases the store's ledger. See the README."
          fi

      # The ledger is the part that must not lose data, so it is checked before
      # anything is packaged.
      - name: Test the ledger
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease \
            -PappVersionName=${{ steps.v.outputs.name }} \
            -PappVersionCode=${{ steps.v.outputs.code }}

      - name: Name the APK after its version
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          OUT="bonded-store-${{ steps.v.outputs.name }}.apk"
          mv "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      # The APK is only useful if the page inside it is the page in this repo,
      # and only installable if it is actually signed.
      - name: Verify the APK
        run: |
          unzip -p "${{ steps.apk.outputs.path }}" assets/www/index.html \
            | sha256sum | cut -d' ' -f1 > packaged.sha
          sha256sum app/index.html | cut -d' ' -f1 > source.sha
          diff packaged.sha source.sha || { echo "::error::The packaged page does not match app/index.html"; exit 1; }

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "${{ steps.apk.outputs.path }}"

          BADGING=$("$BT/aapt2" dump badging "${{ steps.apk.outputs.path }}" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionName='${{ steps.v.outputs.name }}'" \
            || { echo "::error::APK version does not match the tag"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: bonded-store-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
